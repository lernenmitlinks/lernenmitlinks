<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lernen mit Links - Übersicht</title>
    <link rel="stylesheet" href="./assets/css/app-style.css" </head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-bold">LERNEN MIT LINKS</span>
            </div>

            <nav class="sidebar-nav">
                <a href="/app/index.html" class="nav-item active">
                    <i class="fa-solid fa-house icon"></i> Übersicht
                </a>
                <a href="/app/themen.html" class="nav-item">
                    <i class="fa-solid fa-book-open icon"></i> Themen
                </a>
                <a href="/app/training.html" class="nav-item">
                    <i class="fa-solid fa-bullseye icon"></i> Training
                </a>
                <a href="/app/pruefungen.html" class="nav-item">
                    <i class="fa-solid fa-file-signature icon"></i> Prüfungen
                </a>
                <a href="/app/statistik.html" class="nav-item">
                    <i class="fa-solid fa-chart-simple icon"></i> Statistik
                </a>
                <a href="/app/einstellungen.html" class="nav-item">
                    <i class="fa-solid fa-gear icon"></i> Einstellungen
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="app-header">
                <div class="header-right">
                    <a href="#hilfe" class="header-link"><i class="fa-regular fa-circle-question"></i> Hilfe</a>
                    <a href="#profil" class="header-link"><i class="fa-regular fa-user"></i> Profil</a>
                </div>
            </header>

            <section class="content-body">
                <div class="welcome-box">
                    <div class="welcome-text">
                        <h1>Hallo!</h1>
                        <p>Schön, dass du da bist!</p>
                    </div>
                </div>

                <!-- Dashboard -->
                <div class="dashboard-grid">
                    <div class="card progress-card">
                        <h2>Mein Lernfortschritt</h2>
                        <div class="progress-wrapper">
                            <div class="progress-ring-container">
                                <div class="progress-ring">
                                    <span class="overall-progress-text">72%</span>
                                </div>
                            </div>
                            <div class="progress-details">
                                <h3>Gesamtfortschritt</h3>
                                <p class="status-good">Sehr gut! Weiter so!</p>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: 72%;"></div>
                                </div>
                                <p class="sub-text">Du bist auf einem sehr guten Weg.</p>
                            </div>
                        </div>
                    </div>

                    <div class="card topics-card">
                        <h2>Meine Themen</h2>
                        <div class="topics-list-container">
                            <!-- the actual cards will be shown here through frontend.js -->
                        </div>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <script src="./assets/js/frontend.js"></script>
</body>
</html>
